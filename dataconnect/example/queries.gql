# Mello queries - Mental Wellness App

# Get current user's profile
query GetUserProfile @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    email
    displayName
    avatar
    createdAt
  }
}

# List all moods for current user (ordered by recent)
query ListUserMoods @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    moods: moods_on_user(orderBy: { timestamp: DESC }, limit: 30) {
      id
      mood
      intensity
      notes
      timestamp
    }
  }
}

# Get mood statistics for current user (last 7 days)
query GetMoodStats @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    moods: moods_on_user(limit: 100) {
      mood
      intensity
      timestamp
    }
  }
}

# List journal entries for current user
query ListJournalEntries @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    entries: journalEntries_on_user(orderBy: { createdAt: DESC }, limit: 50) {
      id
      title
      content
      tags
      createdAt
      updatedAt
    }
  }
}

# Get single journal entry by ID
query GetJournalEntry($entryId: UUID!) @auth(level: USER) {
  journalEntry(id: $entryId) {
    id
    title
    content
    tags
    createdAt
    updatedAt
    user {
      id
    }
  }
}

# List activities for current user
query ListActivities @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    activities: activities_on_user(orderBy: { completedAt: DESC }, limit: 50) {
      id
      activityType
      duration
      score
      completedAt
    }
  }
}

# List therapy sessions for current user
query ListTherapySessions @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    sessions: therapySessions_on_user(orderBy: { sessionDate: DESC }, limit: 20) {
      id
      therapist
      sessionDate
      duration
      notes
      status
    }
  }
}

# Get latest safety check-in
query GetLatestSafetyCheckIn @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    checkIns: safetyCheckIns_on_user(orderBy: { checkedAt: DESC }, limit: 1) {
      id
      status
      message
      checkedAt
    }
  }
}
